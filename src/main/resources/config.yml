#
#You can get help in our discord, join: dsc.gg/worstek
#For cooldown, use symbols: s, m, h, d. For example: 10d, 10h, 10m, 10s
#In section cooldown, use groups from plugin LuckPerms. Example: wcooldown.group.helper
#

format-seconds: "s"
format-minutes: "m"
format-hours: "h"
format-days: "d"

cooldowns:
  plugins:
    groups:
      helper: "10s"
      moderator: "1s"
      default: "10m"
    commands:
      - plugins
      - pl
    message:
      - "§x§7§4§A§C§F§6● &fWait another §x§7§4§A§C§F§6%cooldown%"
      - "  &fTo use command §x§7§4§A§C§F§6/%command%"